<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Matrix</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <!-- Chrome's side panel header already shows the icon and "Job Matrix". -->
      <span id="status" class="muted small"></span>
      <span class="grow"></span>
      <button class="icon text-size" data-action="text-smaller" title="Smaller text">A−</button>
      <button class="icon text-size" data-action="text-bigger" title="Bigger text">A+</button>
      <button class="icon" data-action="refresh" title="Read the page again">↻</button>
      <button class="icon" data-action="options" title="Options">⚙</button>
    </header>
    <main id="root"><p class="muted pad">Loading…</p></main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
